<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <h2>Dashboard</h2>

  <button onclick="checkMe()">Check Session</button>

  <p id="me"></p>

  <a href="email-change.html">Change Email</a>
</div>

<script>
function checkMe() {
  fetch("/api/auth/me")
    .then(r => r.json())
    .then(d => {
      document.getElementById("me").innerText =
        JSON.stringify(d, null, 2);
    });
}
</script>

</body>
</html>
